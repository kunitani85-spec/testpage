<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITOSHIMA BEACH HOUSE | 糸島の海と過ごす、夏のいちにち。</title>
    <meta name="description" content="福岡・糸島の海辺に佇む夏季限定の海の家「ITOSHIMA BEACH HOUSE」。地元食材のフード、冷えたドリンク、夕陽を眺めるサンセットデッキで、忘れられない夏のひとときを。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .fan-slideshow {
            position: relative;
            width: 300px;
            height: 300px;
            /* 扇子の形：下は要（かなめ）でまとまり、上は弧を描いて広がる */
            clip-path: path("M150,300 L20,50 C70,5 230,5 280,50 Z");
            overflow: hidden;
        }

        .fan-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: fanFade 12s infinite;
        }

        /* 画像ごとのアニメーション遅延（3枚の場合：1枚あたり4秒） */
        .fan-slide:nth-child(1) {
            animation-delay: 0s;
        }

        .fan-slide:nth-child(2) {
            animation-delay: 4s;
        }

        .fan-slide:nth-child(3) {
            animation-delay: 8s;
        }

        @keyframes fanFade {
            0% {
                opacity: 0;
            }

            8% {
                opacity: 1;
            }

            33% {
                opacity: 1;
            }

            41% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

    </style>
</head>

<body>

    <div class="fan-slideshow">
        <div class="fan-slide" style="background-image: url('27418977_m.jpg');"></div>
        <div class="fan-slide" style="background-image: url('27311315_m.jpg');"></div>
        <div class="fan-slide" style="background-image: url('27418977_m.jpg');"></div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規投稿 | 湯の音の宿（デモ）</title>
<meta name="description" content="旅館アプリ 投稿画面プロトタイプ。Instagramの投稿画面のようなUIで、写真とキャプションを旅館アプリ内の口コミに投稿できます。">
<style>
  :root{
    --ig-border:#dbdbdb;
    --ig-divider:#efefef;
    --ig-gap:#fafafa;
    --ig-text:#262626;
    --ig-sub:#8e8e8e;
    --ig-blue:#0095f6;
    --ig-blue-light:#b2dffc;
    --ok:#3d6b2c;
    --ok-bg:#eef5ea;
    --err:#b3452f;
    --err-bg:#fbeae5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#f0f0f0;
    color:var(--ig-text);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    min-height:100vh;
  }

  /* 上部バー */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:48px;
    padding:0 14px;
    border-bottom:1px solid var(--ig-border);
    position:sticky;
    top:0;
    background:#fff;
    z-index:5;
  }
  .topbar button{
    background:none;
    border:none;
    font-size:15px;
    cursor:pointer;
    padding:6px;
  }
  .topbar .cancel{ color:var(--ig-text); }
  .topbar h1{
    font-size:15px;
    font-weight:600;
    margin:0;
  }
  .topbar .share{
    color:var(--ig-blue);
    font-weight:700;
  }
  .topbar .share.disabled{
    color:var(--ig-blue-light);
    cursor:default;
  }

  /* 写真＋キャプション */
  .composer{
    display:flex;
    gap:12px;
    padding:14px 16px;
    align-items:flex-start;
  }
  .photo-box{
    width:64px;
    height:64px;
    border-radius:4px;
    border:1px solid var(--ig-border);
    background:var(--ig-gap);
    flex-shrink:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .photo-box svg{
    width:24px;
    height:24px;
    color:var(--ig-sub);
  }
  input[type=file]{ display:none; }

  textarea.caption{
    flex:1;
    border:none;
    resize:none;
    font-size:14px;
    line-height:1.6;
    font-family:inherit;
    color:var(--ig-text);
    min-height:70px;
    padding:2px 0;
  }
  textarea.caption:focus{ outline:none; }
  textarea.caption::placeholder{ color:var(--ig-sub); }

  /* 行（タグ付け風） */
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 16px;
    border-top:1px solid var(--ig-divider);
  }
  .row-label{
    font-size:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .row-icon{
    width:26px;
    height:26px;
    border-radius:7px;
    background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .row-icon svg{ width:15px; height:15px; color:#fff; }
  .row input[type=text]{
    border:none;
    text-align:right;
    font-size:14px;
    font-family:inherit;
    color:var(--ig-text);
    flex:1;
    margin-left:10px;
  }
  .row input[type=text]:focus{ outline:none; }
  .row input[type=text]::placeholder{ color:var(--ig-sub); }

  .hint{
    padding:12px 16px 0;
    font-size:12px;
    color:var(--ig-sub);
    line-height:1.7;
  }

  .status{
    margin:12px 16px 0;
    font-size:12.5px;
    line-height:1.6;
    padding:10px 12px;
    border-radius:10px;
    display:none;
  }
  .status.show{ display:block; }
  .status.ok{ background:var(--ok-bg); color:var(--ok); }
  .status.err{ background:var(--err-bg); color:var(--err); }

  /* デモ補足エリア */
  .demo-extra{
    margin-top:10px;
    border-top:8px solid var(--ig-gap);
    padding:18px 16px 30px;
  }
  .feed-link{
    text-align:center;
    margin-bottom:20px;
  }
  .feed-link a{
    font-size:13px;
    font-weight:700;
    color:var(--ig-text);
    text-decoration:none;
    border:1px solid var(--ig-border);
    padding:8px 16px;
    border-radius:8px;
  }
  .demo-extra h2{
    font-size:12px;
    color:var(--ig-sub);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin:0 0 8px;
  }
  .demo-extra ol{
    margin:0 0 20px;
    padding-left:18px;
    font-size:12.5px;
    color:var(--ig-sub);
    line-height:1.9;
  }
  .qr-note{ text-align:center; }
  .qr-note img{
    width:110px;
    height:110px;
    border-radius:8px;
    border:1px solid var(--ig-border);
  }
  .qr-note p{
    font-size:11px;
    color:var(--ig-sub);
    margin:8px 0 0;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="cancel" id="cancelBtn" aria-label="閉じる">✕</button>
    <h1>新規投稿</h1>
    <button class="share disabled" id="postBtn" disabled>シェア</button>
  </header>

  <section class="composer">
    <div class="photo-box" id="photoBox">
      <img id="preview" alt="選択した写真のプレビュー" hidden>
      <svg id="placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>
      <input type="file" id="photoInput" accept="image/*" capture="environment">
    </div>
    <textarea id="caption" class="caption" placeholder="キャプションを書く…">湯の音の宿に泊まってきました♨️
静かな時間と美味しいお料理で、心からリフレッシュできました。
また訪れたいです。

#湯の音の宿 #旅館 #温泉旅行 #女子旅 #国内旅行</textarea>
  </section>

  <div class="row">
    <span class="row-label">投稿者名</span>
    <input type="text" id="posterName" placeholder="ゲスト" maxlength="20">
  </div>

  <p class="hint">「シェア」を押すと、旅館アプリの口コミ一覧に投稿されます。</p>

  <div class="status" id="status"></div>

  <div class="demo-extra">
    <div class="feed-link"><a href="ryokan-reviews.html">みんなの口コミを見る</a></div>

    <h2>使い方（デモ説明）</h2>
    <ol>
      <li>お部屋やロビーのQRコードを読み込むと、この画面が開きます</li>
      <li>左上の四角をタップして写真を選択（その場で撮影もOK）</li>
      <li>キャプションと投稿者名は自由に編集できます</li>
      <li>右上の「シェア」で、旅館アプリの口コミ一覧に掲載されます</li>
    </ol>

    <div class="qr-note">
      <img id="qrImg" alt="このページを開くQRコード">
      <p>PCで表示中の場合は、上のQRコードをスマホで読み込むと同じ画面を試せます</p>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'ryokanReviewPosts';

  const photoBox = document.getElementById('photoBox');
  const photoInput = document.getElementById('photoInput');
  const preview = document.getElementById('preview');
  const placeholder = document.getElementById('placeholder');
  const posterName = document.getElementById('posterName');
  const captionEl = document.getElementById('caption');
  const postBtn = document.getElementById('postBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const statusEl = document.getElementById('status');
  const qrImg = document.getElementById('qrImg');

  let selectedFile = null;

  qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(location.href);

  cancelBtn.addEventListener('click', () => { history.length > 1 ? history.back() : (location.href = 'ryokan-reviews.html'); });

  photoBox.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    placeholder.hidden = true;
    postBtn.disabled = false;
    postBtn.classList.remove('disabled');
  });

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = 'status show ' + (kind || 'ok');
  }

  function resizeImageToDataURL(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = objectUrl;
    });
  }

  function loadPosts() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (err) {
      return [];
    }
  }

  function savePosts(posts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  postBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      setStatus('先に写真を選んでください。', 'err');
      photoInput.click();
      return;
    }

    postBtn.disabled = true;
    const caption = captionEl.value;

    try {
      const imageDataUrl = await resizeImageToDataURL(selectedFile, 900, 0.8);
      const posts = loadPosts();
      posts.unshift({
        id: Date.now(),
        name: posterName.value.trim() || 'ゲスト',
        caption: caption,
        image: imageDataUrl,
        createdAt: new Date().toISOString()
      });
      savePosts(posts);

      setStatus('口コミに投稿しました。', 'ok');
      setTimeout(() => { location.href = 'ryokan-reviews.html'; }, 1200);
    } catch (err) {
      setStatus('保存に失敗しました。写真のサイズを小さくして再度お試しください。', 'err');
      postBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
